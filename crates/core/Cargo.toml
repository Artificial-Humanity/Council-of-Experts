[package]
name = "panel-of-experts-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
once_cell = "1.19"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["sync", "rt", "macros"] }
futures-util = "0.3"
async-trait = "0.1"
